<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Puppeteer: Receiver Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; color: #38bdf8; }
        #status { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        .dashboard {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        
        .canvas-container {
            flex: 1;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            border: 2px solid #334155;
        }
        
        /* The avatar circle placeholder */
        #puppet-face {
            width: 150px;
            height: 150px;
            background-color: #38bdf8;
            border-radius: 50%;
            position: relative;
            transition: transform 0.05s linear;
        }
        
        .eye {
            width: 25px;
            height: 25px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: height 0.05s ease;
        }
        .eye-pupil { width: 10px; height: 10px; background: #000; border-radius: 50%; }
        #eye-left { left: 30px; }
        #eye-right { right: 30px; }
        
        #mouth {
            width: 50px;
            height: 15px;
            background-color: #1e293b;
            border-radius: 20px;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            transition: height 0.05s ease;
        }

        .data-card {
            width: 300px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #334155;
        }
        pre {
            font-family: monospace;
            color: #34d399;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Puppet Dashboard</h1>
    <div id="status">Connecting to Supabase stream...</div>

    <div class="dashboard">
        <div class="canvas-container">
            <div id="puppet-face">
                <div class="eye" id="eye-left"><div class="eye-pupil"></div></div>
                <div class="eye" id="eye-right"><div class="eye-pupil"></div></div>
                <div id="mouth"></div>
            </div>
        </div>

        <div class="data-card">
            <h3>Incoming Feed</h3>
            <pre id="stream-log">Waiting for phone tracking to start...</pre>
        </div>
    </div>

    <script>
        // REPLACE THESE with the exact same credentials you used in your app.js
        const SUPABASE_URL = "https://your-project-id.supabase.co";
        const SUPABASE_ANON_KEY = "your-actual-anon-key-here";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const statusDiv = document.getElementById("status");
        const streamLog = document.getElementById("stream-log");
        
        // DOM element hooks for the puppet components
        const puppetFace = document.getElementById("puppet-face");
        const eyeLeft = document.getElementById("eye-left");
        const eyeRight = document.getElementById("eye-right");
        const mouth = document.getElementById("mouth");

        // Open up the exact same communication room
        const faceChannel = supabase.channel('puppeteer-room-1');

        faceChannel
          .on('broadcast', { event: 'face-move' }, (response) => {
              const data = response.payload;
              
              // 1. Log the values onto our terminal readout
              streamLog.innerText = JSON.stringify(data, null, 2);
              
              // 2. Animate head rotation (Yaw = turn, Pitch = tilt)
              // We translate radians into visual CSS degrees
              const degYaw = data.rotation.yaw * (180 / Math.PI) * 1.5;
              const degPitch = data.rotation.pitch * (180 / Math.PI) * 1.5;
              puppetFace.style.transform = `rotateY(${degYaw}deg) rotateX(${degPitch}deg)`;
              
              // 3. Morph expressions (Mouth open scaling layout)
              const mouthHeight = 15 + (data.expressions.jawOpen * 40);
              mouth.style.height = `${mouthHeight}px`;
              
              // 4. Handle eye blinking transformations
              if (data.expressions.eyeBlinkLeft > 0.5) {
                  eyeLeft.style.height = "2px";
              } else {
                  eyeLeft.style.height = "25px";
              }
              
              if (data.expressions.eyeBlinkRight > 0.5) {
                  eyeRight.style.height = "2px";
              } else {
                  eyeRight.style.height = "25px";
              }
          })
          .subscribe((status) => {
              if (status === 'SUBSCRIBED') {
                  statusDiv.innerText = "🟢 Connected! Stream data from your phone to animate.";
                  statusDiv.style.color = "#34d399";
              }
          });
    </script>
</body>
</html>
