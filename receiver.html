<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Puppeteer — Mesh Warp</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Syne+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#06080f;color:#dde4f0;
  font-family:'Syne Mono',monospace;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:20px 12px;
}
h1{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(15px,2.8vw,24px);color:#00f0ff;
  text-shadow:0 0 18px #00f0ff66;margin-bottom:3px;letter-spacing:3px;
}
#status{font-size:11px;color:#4a6080;margin-bottom:14px;letter-spacing:1px}
#error-msg{color:#f87171;font-size:11px;margin-bottom:8px;display:none;
  background:#1e0a0a;padding:6px 12px;border-radius:6px;border:1px solid #f8717144}
.dashboard{display:flex;flex-wrap:wrap;gap:14px;max-width:980px;width:100%;justify-content:center}
.panel{background:#0b1220;border:1px solid #1a3050;border-radius:12px;padding:14px;
  box-shadow:0 0 24px #00f0ff08}
.ptitle{font-family:'Orbitron',sans-serif;font-size:9px;color:#00f0ff;letter-spacing:2px;margin-bottom:8px}

/* Main canvas */
#viewer{position:relative;width:440px;height:440px;border-radius:10px;overflow:hidden;background:#000}
#viewer canvas{position:absolute;top:0;left:0;width:100%;height:100%}

.upload-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.upload-row label{font-size:10px;color:#7090b0}
.upload-row input[type=file]{font-size:10px;color:#c0d0e0;background:#111e2e;
  border:1px solid #2a4060;border-radius:5px;padding:3px 7px;cursor:pointer}

.bars{display:flex;flex-direction:column;gap:4px;margin-top:8px;width:440px}
.br{display:flex;align-items:center;gap:7px}
.bl{font-size:9px;color:#4a6080;width:72px;flex-shrink:0}
.bt{flex:1;height:4px;background:#111e2e;border-radius:2px;overflow:hidden}
.bf{height:100%;border-radius:2px;transition:width .04s;background:#00f0ff;width:0%}
.bf.j{background:#fbbf24}.bf.s{background:#34d399}

#stream-log{font-size:9px;color:#34d399;background:#060810;padding:10px;border-radius:7px;
  max-height:360px;overflow-y:auto;white-space:pre;min-width:190px;
  border:1px solid #0a2018;line-height:1.8}

/* Hidden source canvas */
#srcCanvas{display:none}
@media(max-width:490px){#viewer{width:340px;height:340px}.bars{width:340px}}
</style>
</head>
<body>
<h1>◈ FACE PUPPETEER</h1>
<div id="status">Connecting…</div>
<div id="error-msg"></div>

<div class="dashboard">
  <div class="panel">
    <div class="upload-row">
      <label>FACE IMAGE →</label>
      <input type="file" id="imgIn" accept="image/*">
    </div>
    <div id="viewer">
      <canvas id="bgCanvas"></canvas>   <!-- static bg / base layer -->
      <canvas id="meshCanvas"></canvas> <!-- warped mesh on top -->
    </div>
    <div class="bars">
      <div class="br"><span class="bl">JAW</span><div class="bt"><div class="bf j" id="bj"></div></div></div>
      <div class="br"><span class="bl">BLINK L</span><div class="bt"><div class="bf" id="bbl"></div></div></div>
      <div class="br"><span class="bl">BLINK R</span><div class="bt"><div class="bf" id="bbr"></div></div></div>
      <div class="br"><span class="bl">SMILE</span><div class="bt"><div class="bf s" id="bsm"></div></div></div>
    </div>
  </div>
  <div class="panel" style="flex:1;min-width:190px">
    <div class="ptitle">⬡ LIVE FEED</div>
    <pre id="stream-log">Waiting…</pre>
  </div>
</div>
<canvas id="srcCanvas" width="512" height="512"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const SUPABASE_URL      = "https://dmavecishluzeqdddaqy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aTPFO65SpkKXmku2Nm7XGQ_tgRcXpFg";

// ═══════════════════════════════════════════════
// MEDIAPIPE FACE MESH TRIANGLE LIST
// These 468-point triangles come from the canonical
// FaceMesh TRIS definition used by MediaPipe itself.
// Each triplet = indices into the 468-landmark array.
// ═══════════════════════════════════════════════
const TRIS = [
  10,338,297,10,297,332,10,332,284,10,284,251,10,251,389,10,389,356,
  10,356,454,10,454,323,10,323,361,10,361,288,10,288,397,10,397,365,
  10,365,379,10,379,378,10,378,400,10,400,377,10,377,152,10,152,148,
  10,148,176,10,176,149,10,149,150,10,150,136,10,136,172,10,172,58,
  10,58,132,10,132,93,10,93,234,10,234,127,10,127,162,10,162,21,
  10,21,54,10,54,103,10,103,67,10,67,109,10,109,10,
  // Face outline + cheeks
  162,21,54,54,103,67,67,109,10,10,338,297,297,332,284,284,251,389,
  389,356,454,454,323,361,361,288,397,397,365,379,379,378,400,400,377,152,
  152,148,176,176,149,150,150,136,172,172,58,132,132,93,234,234,127,162,
  // Forehead & temples
  10,109,67,10,67,103,10,103,54,10,54,21,
  // Left eye
  33,7,163,163,144,145,145,153,154,154,155,133,
  33,246,161,161,160,159,159,158,157,157,173,133,
  // Right eye
  362,382,381,381,380,374,374,373,390,390,249,263,
  362,398,384,384,385,386,386,387,388,388,466,263,
  // Left eyebrow
  46,53,52,52,65,55,55,70,63,63,105,66,66,107,55,
  // Right eyebrow
  276,283,282,282,295,285,285,300,293,293,334,296,296,336,285,
  // Nose
  168,6,197,197,195,5,5,4,1,1,19,94,94,2,164,
  98,97,2,2,326,327,327,331,279,279,360,363,
  // Left cheek
  205,36,142,142,100,57,57,186,92,92,165,167,
  // Right cheek
  425,266,371,371,329,287,287,410,322,322,391,393,
  // Mouth outer
  61,185,40,40,39,37,37,0,267,267,269,270,270,409,291,
  61,146,91,91,181,84,84,17,314,314,405,321,321,375,291,
  // Mouth inner (lips)
  78,95,88,88,178,87,87,14,317,317,402,318,318,324,308,
  78,191,80,80,81,82,82,13,312,312,311,310,310,415,308,
  // Chin & jaw
  152,377,400,400,378,379,379,365,397,397,288,361,
  152,148,176,176,149,150,150,136,172,172,58,132,
  // Left jaw line
  136,150,149,149,176,148,148,152,377,
  // Right jaw line  
  365,379,378,378,400,377,377,152,148,
  // Fill triangles across face
  356,389,251,454,356,323,323,356,361,
  132,58,172,93,132,172,234,93,127,
  127,93,162,162,93,21,21,93,54,
  // More cheek fill
  116,123,147,147,213,192,192,214,207,207,187,50,
  345,352,376,376,433,421,421,434,432,432,411,280,
  // Eye corners connection
  130,33,226,226,25,110,
  359,263,446,446,255,339,
  // Nose bridge fill
  193,168,245,245,193,122,122,6,168,
  // Full face centre fill
  1,2,98,1,98,168,1,168,197,1,197,6,
  // Additional coverage
  4,275,440,440,275,363,4,1,275,
  4,440,275,1,4,19,19,4,94,94,4,2,
  // Forehead fill
  21,162,54,54,162,103,103,162,67,67,162,109,109,162,10,
];

// ═══════════════════════════════════════════════
// DOM + CANVAS SETUP
// ═══════════════════════════════════════════════
const statusDiv = document.getElementById("status");
const errDiv    = document.getElementById("error-msg");
const sLog      = document.getElementById("stream-log");
const imgIn     = document.getElementById("imgIn");

const viewer    = document.getElementById("viewer");
const VW        = viewer.offsetWidth, VH = viewer.offsetHeight;

const bgCv  = document.getElementById("bgCanvas");
const meshCv= document.getElementById("meshCanvas");
bgCv.width  = meshCv.width  = VW;
bgCv.height = meshCv.height = VH;
const bgCtx   = bgCv.getContext("2d");
const meshCtx = meshCv.getContext("2d");

const srcCv  = document.getElementById("srcCanvas");
const srcCtx = srcCv.getContext("2d");
const SW = srcCv.width, SH = srcCv.height; // 512×512

const bj=document.getElementById("bj"), bbl=document.getElementById("bbl");
const bbr=document.getElementById("bbr"),bsm=document.getElementById("bsm");

function showErr(m){ errDiv.textContent="⚠ "+m; errDiv.style.display="block"; }
function pct(v){ return (Math.max(0,Math.min(1,v))*100)+"%"; }

// ═══════════════════════════════════════════════
// FACE IMAGE
// ═══════════════════════════════════════════════
const faceImg = new Image();
faceImg.crossOrigin = "anonymous";
let imgReady = false;

faceImg.onload = () => {
  imgReady = true;
  // Draw to srcCanvas for pixel sampling during warp
  srcCtx.clearRect(0,0,SW,SH);
  srcCtx.drawImage(faceImg,0,0,SW,SH);
  // Draw base to bgCanvas (always visible behind mesh)
  bgCtx.clearRect(0,0,VW,VH);
  bgCtx.drawImage(faceImg,0,0,VW,VH);
};
faceImg.onerror = () => showErr("Image load failed — upload one below.");
faceImg.src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=512&h=512&q=80";

imgIn.addEventListener("change", e => {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{ faceImg.src=ev.target.result; };
  r.readAsDataURL(f);
});

// ═══════════════════════════════════════════════
// NEUTRAL LANDMARK POSITIONS
// When we receive the first frame we store the "rest"
// landmarks so we can compute deltas.
// ═══════════════════════════════════════════════
let neutralLM   = null;   // first-frame neutral pose
let lastLM      = null;   // most recent landmarks
let lerpLM      = null;   // smoothed landmarks for render
const SMOOTH    = 0.25;   // lerp factor (0=frozen, 1=raw)

// ═══════════════════════════════════════════════
// MESH WARP RENDERER
// ═══════════════════════════════════════════════
function renderMesh(lm, expressions) {
  if (!imgReady || !lm) return;
  meshCtx.clearRect(0,0,VW,VH);

  // Map normalised [0,1] landmarks → pixel coords on VW×VH canvas
  // lm[i].x/y are in 0-1 range from MediaPipe
  const px = i => lm[i].x * VW;
  const py = i => lm[i].y * VH;
  // Source coords on 512×512 srcCanvas
  // We use the NEUTRAL pose as the source UV, current pose as destination
  // → mesh warps to follow your movements
  const spx = i => (neutralLM ? neutralLM[i].x : lm[i].x) * SW;
  const spy = i => (neutralLM ? neutralLM[i].y : lm[i].y) * SH;

  // Draw each triangle
  for (let t = 0; t < TRIS.length; t += 3) {
    const a = TRIS[t], b = TRIS[t+1], c = TRIS[t+2];
    if (a >= lm.length || b >= lm.length || c >= lm.length) continue;

    // Destination triangle (where to draw on screen — follows live pose)
    const dx0=px(a), dy0=py(a);
    const dx1=px(b), dy1=py(b);
    const dx2=px(c), dy2=py(c);

    // Source triangle (what part of the image to sample — neutral pose)
    const sx0=spx(a), sy0=spy(a);
    const sx1=spx(b), sy1=spy(b);
    const sx2=spx(c), sy2=spy(c);

    drawWarpedTriangle(
      meshCtx, srcCv,
      sx0,sy0, sx1,sy1, sx2,sy2,
      dx0,dy0, dx1,dy1, dx2,dy2
    );
  }
}

// ── Affine warp: draw source triangle onto destination triangle ───────────────
function drawWarpedTriangle(ctx, src,
  sx0,sy0, sx1,sy1, sx2,sy2,
  dx0,dy0, dx1,dy1, dx2,dy2)
{
  // Skip degenerate triangles
  const area = Math.abs((dx1-dx0)*(dy2-dy0)-(dx2-dx0)*(dy1-dy0));
  if (area < 0.5) return;

  ctx.save();

  // Clip to destination triangle
  ctx.beginPath();
  ctx.moveTo(dx0,dy0);
  ctx.lineTo(dx1,dy1);
  ctx.lineTo(dx2,dy2);
  ctx.closePath();
  ctx.clip();

  // Solve affine transform from source → destination
  // [sx0 sx1 sx2]   [a c e]   [dx0 dx1 dx2]
  // [sy0 sy1 sy2] × [b d f] = [dy0 dy1 dy2]
  // [1   1   1  ]             [1   1   1  ]
  //
  // We need the INVERSE: dest → source, so drawImage maps correctly.
  // Transform T maps source → dest.
  // We set the canvas transform to T, then draw the src image.

  // Build matrix that maps src triangle → dest triangle
  // Using the standard 2D affine solve:
  const denom = (sx1-sx0)*(sy2-sy0) - (sx2-sx0)*(sy1-sy0);
  if (Math.abs(denom) < 0.001) { ctx.restore(); return; }

  const m00 = ((dx1-dx0)*(sy2-sy0) - (dx2-dx0)*(sy1-sy0)) / denom;
  const m01 = ((dx2-dx0)*(sx1-sx0) - (dx1-dx0)*(sx2-sx0)) / denom;
  const m10 = ((dy1-dy0)*(sy2-sy0) - (dy2-dy0)*(sy1-sy0)) / denom;
  const m11 = ((dy2-dy0)*(sx1-sx0) - (dy1-dy0)*(sx2-sx0)) / denom;
  const m02 = dx0 - m00*sx0 - m01*sy0;
  const m12 = dy0 - m10*sx0 - m11*sy0;

  ctx.transform(m00, m10, m01, m11, m02, m12);
  ctx.drawImage(src, 0, 0);

  ctx.restore();
}

// ═══════════════════════════════════════════════
// SMOOTH LERP UPDATE
// ═══════════════════════════════════════════════
function lerpLandmarks(target) {
  if (!lerpLM) {
    lerpLM = target.map(p => ({x:p.x, y:p.y, z:p.z}));
    return;
  }
  for (let i=0; i<lerpLM.length; i++) {
    lerpLM[i].x += (target[i].x - lerpLM[i].x) * SMOOTH;
    lerpLM[i].y += (target[i].y - lerpLM[i].y) * SMOOTH;
    lerpLM[i].z += (target[i].z - lerpLM[i].z) * SMOOTH;
  }
}

// ═══════════════════════════════════════════════
// RENDER LOOP (decoupled from network)
// ═══════════════════════════════════════════════
let lastPayload = null;
function renderLoop() {
  if (lastPayload && lerpLM) {
    lerpLandmarks(lastPayload.landmarks);
    renderMesh(lerpLM, lastPayload.expressions);
  }
  requestAnimationFrame(renderLoop);
}
renderLoop();

// ═══════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════
let sb;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
catch(e) { showErr("Supabase: "+e.message); }

if (sb) {
  sb.channel("puppeteer-room-1")
    .on("broadcast", {event:"face-move"}, ({payload:d}) => {
      sLog.innerText = JSON.stringify({
        rotation: d.rotation,
        expressions: d.expressions,
        landmarks: `[${d.landmarks?.length} points]`
      }, null, 2);

      if (!d.landmarks || d.landmarks.length < 400) return;

      // Capture neutral on first frame
      if (!neutralLM) {
        neutralLM = d.landmarks.map(p=>({x:p.x,y:p.y,z:p.z}));
        lerpLM    = neutralLM.map(p=>({...p}));
        statusDiv.innerText = "🟢  Neutral captured — tracking live!";
      }

      lastPayload = d;

      // Update bars
      const e = d.expressions;
      bj.style.width  = pct(e.jawOpen);
      bbl.style.width = pct(e.eyeBlinkLeft);
      bbr.style.width = pct(e.eyeBlinkRight);
      bsm.style.width = pct((e.mouthSmileLeft+e.mouthSmileRight)/2);
    })
    .subscribe(s => {
      if (s === "SUBSCRIBED") {
        statusDiv.innerText   = "🟢  Connected — waiting for face data…";
        statusDiv.style.color = "#34d399";
      } else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT") {
        showErr("Channel "+s+" — check ANON KEY");
        statusDiv.innerText   = "🔴  Disconnected";
        statusDiv.style.color = "#f87171";
      }
    });
}
</script>
</body>
</html>
