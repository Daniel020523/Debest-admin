<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Puppeteer Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; color: #38bdf8; }
        #status { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        #error-msg { color: #f87171; font-size: 13px; margin-bottom: 10px; display: none; }

        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .dashboard { flex-direction: row; }
        }

        .canvas-container {
            flex: 1.5;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 450px;
            border: 2px solid #334155;
        }

        .upload-panel {
            margin-bottom: 15px;
            background: #334155;
            padding: 10px 20px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        /* FIX #6: perspective + preserve-3d must be on the WRAPPER, not the canvas.
           The canvas itself gets the rotateY/rotateX transform applied. */
        #canvas-wrapper {
            perspective: 1000px;
        }

        #faceCanvas {
            max-width: 100%;
            height: auto;
            background: #0f172a;
            border-radius: 8px;
            transition: transform 0.06s ease-out;
            /* preserve-3d removed from here — it has no effect on a canvas element */
        }

        .data-card {
            flex: 1;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #334155;
        }
        h3 { margin-top: 0; color: #38bdf8; }
        pre {
            font-family: monospace;
            font-size: 13px;
            color: #34d399;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            max-height: 380px;
            white-space: pre-wrap;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>📸 Photo Puppeteer Dashboard</h1>
<div id="status">Connecting to Supabase…</div>
<div id="error-msg"></div>

<div class="dashboard">
    <div class="canvas-container">
        <div class="upload-panel">
            <label for="imageLoader"><b>Upload Face Image:</b></label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        <!-- FIX #6: wrapper carries perspective so canvas 3D rotation renders correctly -->
        <div id="canvas-wrapper">
            <canvas id="faceCanvas" width="400" height="400"></canvas>
        </div>
    </div>

    <div class="data-card">
        <h3>Incoming Feed</h3>
        <pre id="stream-log">Waiting for phone tracking to start…</pre>
    </div>
</div>

<script>
// ── Supabase credentials ──────────────────────────────────────────────────────
const SUPABASE_URL      = "https://dmavecishluzeqdddaqy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aTPFO65SpkKXmku2Nm7XGQ_tgRcXpFg"; // ← replace with real eyJ... key

// ── DOM refs ──────────────────────────────────────────────────────────────────
const statusDiv  = document.getElementById("status");
const errorMsg   = document.getElementById("error-msg");
const streamLog  = document.getElementById("stream-log");
const canvas     = document.getElementById("faceCanvas");
const ctx        = canvas.getContext("2d");
const imageLoader = document.getElementById("imageLoader");

function showError(msg) {
    errorMsg.textContent  = "⚠️ " + msg;
    errorMsg.style.display = "block";
}

// ── Target image ──────────────────────────────────────────────────────────────
const targetImage = new Image();
targetImage.crossOrigin = "anonymous";
targetImage.onload  = () => resetFace();
targetImage.onerror = () => showError("Failed to load default image. Upload one manually.");
// Attach onload BEFORE setting src
targetImage.src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&h=400&q=80";

imageLoader.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload  = (ev) => {
        targetImage.onload  = () => resetFace();
        targetImage.onerror = () => showError("Could not load selected image.");
        targetImage.src = ev.target.result;
    };
    reader.onerror = () => showError("Could not read selected file.");
    reader.readAsDataURL(file);
});

function resetFace() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(targetImage, 0, 0, canvas.width, canvas.height);
}

// ── Supabase realtime ─────────────────────────────────────────────────────────
let supabaseClient;
try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
    showError("Supabase init failed: " + e.message);
}

if (supabaseClient) {
    const faceChannel = supabaseClient.channel("puppeteer-room-1");

    faceChannel
        .on("broadcast", { event: "face-move" }, ({ payload: data }) => {
            streamLog.innerText = JSON.stringify(data, null, 2);
            applyFacePuppet(data);
        })
        .subscribe((status) => {
            if (status === "SUBSCRIBED") {
                statusDiv.innerText    = "🟢 Connected! Waiting for tracking data…";
                statusDiv.style.color  = "#34d399";
            } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
                showError(`Channel error: ${status}. Check your ANON KEY.`);
                statusDiv.innerText    = "🔴 Connection failed.";
                statusDiv.style.color  = "#f87171";
            }
        });
}

// ── Puppet rendering ──────────────────────────────────────────────────────────
function applyFacePuppet(data) {
    // 1. 3D head rotation via CSS transform on canvas
    // FIX #6: canvas (not a parent with preserve-3d) receives transform;
    // the #canvas-wrapper provides the perspective context.
    const degYaw   = (data.rotation.yaw   * 180 / Math.PI) * 1.5;
    const degPitch = (data.rotation.pitch * 180 / Math.PI) * 1.5;
    const degRoll  = data.rotation.roll ? (data.rotation.roll * 180 / Math.PI) * 0.8 : 0;
    canvas.style.transform = `rotateY(${degYaw}deg) rotateX(${-degPitch}deg) rotateZ(${degRoll}deg)`;

    // 2. Expression values
    const jaw    = Math.min(1, data.expressions.jawOpen        || 0);
    const blinkL = Math.min(1, data.expressions.eyeBlinkLeft   || 0);
    const blinkR = Math.min(1, data.expressions.eyeBlinkRight  || 0);
    const smileL = data.expressions.mouthSmileLeft  || 0;
    const smileR = data.expressions.mouthSmileRight || 0;
    const frownL = data.expressions.mouthFrownLeft  || 0;
    const frownR = data.expressions.mouthFrownRight || 0;

    const avgSmile = (smileL + smileR) / 2;
    const avgFrown = (frownL + frownR) / 2;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ── Slice layout (contiguous, non-overlapping 400×400 image) ──────────────
    // Zone       src-y   src-h   dest-y   dest-h
    // Forehead    0      130       0       130    (static)
    // Eyes       130      55     130        55    (squash per blink)
    // Nose       185      55     185        55    (static)
    // Mouth      240     100     240       100    (stretch per jaw + shift per expression)
    // Chin       340      60    340+delta   60    (shifts down with jaw)

    // Forehead / hair (static)
    ctx.drawImage(targetImage, 0, 0, 400, 130,  0, 0, 400, 130);

    // Left eye — squash vertically on blink
    const hLE   = Math.max(3, 55 * (1 - blinkL * 0.9));
    const yOffLE = 130 + (55 - hLE) / 2;
    ctx.drawImage(targetImage, 0,   130, 160, 55,  0,   yOffLE, 160, hLE);

    // Right eye — squash vertically on blink
    const hRE   = Math.max(3, 55 * (1 - blinkR * 0.9));
    const yOffRE = 130 + (55 - hRE) / 2;
    ctx.drawImage(targetImage, 240, 130, 160, 55,  240, yOffRE, 160, hRE);

    // Nose bridge (centre, unaffected by blink)
    ctx.drawImage(targetImage, 160, 130, 80, 55,  160, 130, 80, 55);

    // Cheeks / nose area (static)
    ctx.drawImage(targetImage, 0, 185, 400, 55,  0, 185, 400, 55);

    // Mouth region — stretch down with jaw, shift with smile/frown
    const hMouthStretch   = jaw * 40;
    let expressionYOffset = 0;
    if      (avgSmile > 0.25) expressionYOffset = -8;
    else if (avgFrown > 0.25) expressionYOffset =  8;

    ctx.drawImage(
        targetImage,
        50, 240, 300, 100,
        50, 240 + expressionYOffset, 300, 100 + hMouthStretch
    );

    // Chin — shifts down proportionally with jaw open
    const chinDestY = Math.min(340 + hMouthStretch, canvas.height - 60);
    ctx.drawImage(targetImage, 0, 340, 400, 60,  0, chinDestY, 400, 60);
}
</script>
</body>
</html>
