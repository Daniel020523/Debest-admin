<!-- process.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Fee Payment & Verification</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --paypal-blue: #0070ba;
            --paypal-dark-blue: #003087;
            --paypal-light: #f5f7fa;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--paypal-light);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--paypal-blue);
            margin-bottom: 20px;
            letter-spacing: -1px;
            text-align: center;
        }

        .logo span {
            color: var(--paypal-dark-blue);
        }

        h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #444;
        }

        input[type="file"], input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--paypal-blue);
        }

        .btn-paypal {
            background-color: var(--paypal-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 112, 186, 0.3);
            margin-top: 10px;
        }

        .btn-paypal:hover {
            background-color: var(--paypal-dark-blue);
        }

        .loader {
            display: none;
            text-align: center;
            font-size: 14px;
            color: var(--paypal-blue);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Pay<span>Pal</span></div>
        <h2>Processing Fee & Proof Upload</h2>
        <p>Complete payment confirmation and upload your payment receipt or screenshot to finalize.</p>

        <form id="paymentForm">
            <div class="form-group">
                <label for="userName">Full Name (John Daniel)</label>
                <input type="text" id="userName" value="John Daniel" readonly>
            </div>

            <div class="form-group">
                <label for="userEmail">PayPal Email</label>
                <input type="email" id="userEmail" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="feeAmount">Processing Fee ($ USD)</label>
                <input type="text" id="feeAmount" value="$5.00 USD" readonly>
            </div>

            <div class="form-group">
                <label for="paymentProof">Upload Payment Screenshot / Receipt</label>
                <input type="file" id="paymentProof" accept="image/*" required>
            </div>

            <button type="submit" class="btn-paypal" id="submitBtn">Submit Payment & Proof</button>
            <div class="loader" id="loaderText">Uploading data to Supabase... Please wait.</div>
        </form>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE URL AND ANON KEY
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        
        // Initialize Supabase Client
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('userEmail').value.trim();
            const fileInput = document.getElementById('paymentProof');
            const submitBtn = document.getElementById('submitBtn');
            const loaderText = document.getElementById('loaderText');

            if (!fileInput.files.length) {
                alert('Please upload a payment proof image.');
                return;
            }

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36.substring(2, 7))}.${fileExt}`;
            const filePath = `receipts/${fileName}`;

            submitBtn.style.display = 'none';
            loaderText.style.display = 'block';

            try {
                // 1. Upload image to Supabase Storage bucket named 'payment-proofs'
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('payment-proofs')
                    .upload(filePath, file);

                if (uploadError) {
                    throw uploadError;
                }

                // 2. (Optional) Save metadata record in a Supabase table named 'transactions'
                const { error: dbError } = await supabaseClient
                    .from('transactions')
                    .insert([
                        { 
                            name: 'John Daniel', 
                            email: email, 
                            amount_paid: '5.00', 
                            proof_url: filePath 
                        }
                    ]);

                if (dbError) {
                    console.warn('File uploaded, but database entry failed:', dbError.message);
                }

                alert('Payment proof submitted successfully! Your account will be credited shortly.');
                document.getElementById('paymentForm').reset();
                window.location.href = 'index.html'; // Go back or to success page

            } catch (error) {
                alert('Error uploading file: ' + error.message);
                submitBtn.style.display = 'block';
                loaderText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
